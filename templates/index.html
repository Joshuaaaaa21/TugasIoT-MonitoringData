<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoring suhu &amp; cahaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --page:#E9ECEF;
    --panel:#FFFFFF;
    --rule:#D2D8DE;
    --ink:#16202B;
    --muted:#5C6B7A;
    --suhu:#1E6B8C;
    --cahaya:#B8820F;
    --on:#2F7D4F;
    --off:#A03A2B;
    --radius:5px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--page);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    padding:22px 18px 40px;
  }
  .panel{
    max-width:1080px;margin:0 auto;
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    overflow:hidden;
  }

  /* --- kepala panel */
  header{
    display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;
    padding:18px 22px;border-bottom:1px solid var(--rule);
  }
  h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-0.01em}
  .topic{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
  .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:#B9C2CA;flex:none}
  .dot.live{background:var(--on)}
  .dot.idle{background:var(--cahaya)}

  /* --- baris pengukuran: angka + grafiknya */
  .row{display:grid;grid-template-columns:200px 1fr;border-bottom:1px solid var(--rule)}
  .readout{
    padding:20px 22px;border-right:1px solid var(--rule);
    display:flex;flex-direction:column;justify-content:center;gap:2px;
  }
  .readout .name{font-size:13px;color:var(--muted)}
  .value{font-family:"IBM Plex Mono",monospace;font-size:44px;font-weight:500;letter-spacing:-0.03em;line-height:1.05}
  .unit{font-size:15px;font-weight:400;color:var(--muted);margin-left:4px}
  .row.suhu .value{color:var(--suhu)}
  .row.cahaya .value{color:var(--cahaya)}
  .plot{padding:12px 16px;height:190px;position:relative}

  /* --- deret tombol */
  .controls{display:flex;flex-wrap:wrap;gap:22px;justify-content:space-between;padding:16px 22px}
  .group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .group .name{font-size:13px;color:var(--muted);margin-right:2px}
  button{
    font:inherit;font-size:14px;font-weight:500;
    background:#F4F6F8;color:var(--ink);
    border:1px solid var(--rule);border-radius:var(--radius);
    padding:8px 15px;cursor:pointer;
  }
  button:hover:not(:disabled){background:#E7EBEF}
  button:focus-visible{outline:2px solid var(--suhu);outline-offset:2px}
  button:disabled{opacity:.45;cursor:not-allowed}
  button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .lampu-on[aria-pressed="true"]{background:var(--on);border-color:var(--on)}
  .lampu-off[aria-pressed="true"]{background:var(--off);border-color:var(--off)}

  .note{
    max-width:1080px;margin:10px auto 0;padding:0 4px;
    font-size:13px;color:var(--muted);min-height:20px;
  }
  .note.warn{color:var(--off)}

  @media (max-width:640px){
    .row{grid-template-columns:1fr}
    .readout{border-right:none;border-bottom:1px solid var(--rule);padding:14px 18px}
    .value{font-size:36px}
    .plot{height:170px}
    .controls{gap:14px}
  }
</style>
</head>
<body>

<main class="panel">
  <header>
    <div>
      <h1>Monitoring suhu &amp; cahaya</h1>
      <div class="topic">kelompok01_IF_IoT/datasensor</div>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Menyambung ke broker…</span></div>
  </header>

  <section class="row suhu">
    <div class="readout">
      <span class="name">Suhu</span>
      <span class="value" id="valSuhu">–<span class="unit">°C</span></span>
    </div>
    <div class="plot"><canvas id="chartSuhu"></canvas></div>
  </section>

  <section class="row cahaya">
    <div class="readout">
      <span class="name">Cahaya</span>
      <span class="value" id="valCahaya">–<span class="unit">ADC</span></span>
    </div>
    <div class="plot"><canvas id="chartCahaya"></canvas></div>
  </section>

  <div class="controls">
    <div class="group">
      <button id="btnMulai">Mulai rekam</button>
      <button id="btnBerhenti" disabled>Berhenti</button>
      <button id="btnReset">Hapus data</button>
      <button id="btnExcel">Unduh Excel</button>
    </div>
    <div class="group">
      <span class="name">LED</span>
      <button class="lampu-on" id="btnLedOn" aria-pressed="false">Nyalakan</button>
      <button class="lampu-off" id="btnLedOff" aria-pressed="false">Matikan</button>
    </div>
  </div>
</main>

<p class="note" id="note">Tekan “Mulai rekam” untuk mulai menyimpan data yang masuk.</p>

<script>
const MAX_TITIK = 120;          // titik yang ditampilkan di grafik
let since = 0, sesi = null, merekam = false;

const note = document.getElementById('note');
function pesan(teks, warn = false){
  note.textContent = teks;
  note.classList.toggle('warn', warn);
}

function buatGrafik(id, warna, label, integer){
  return new Chart(document.getElementById(id), {
    type:'line',
    data:{labels:[],datasets:[{
      data:[], label, borderColor:warna, backgroundColor:warna+'1A',
      borderWidth:2, pointRadius:0, tension:0.25, fill:true, spanGaps:true
    }]},
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{mode:'index', intersect:false},
      plugins:{legend:{display:false},
        tooltip:{displayColors:false,
          callbacks:{title:i=>`Detik ${i[0].label}`,
                     label:i=>`${label}: ${i.parsed.y}`}}},
      scales:{
        x:{title:{display:true,text:'Waktu (detik)',color:'#5C6B7A',font:{size:11}},
           ticks:{color:'#5C6B7A',font:{size:11},maxTicksLimit:8},
           grid:{color:'#EDF0F3'}},
        y:{ticks:{color:'#5C6B7A',font:{size:11},
                  callback:v=>integer?v:Number(v).toFixed(1)},
           grid:{color:'#EDF0F3'}}
      }
    }
  });
}

const grafikSuhu   = buatGrafik('chartSuhu','#1E6B8C','Suhu (°C)',false);
const grafikCahaya = buatGrafik('chartCahaya','#B8820F','Cahaya (ADC)',true);

function kosongkanGrafik(){
  [grafikSuhu,grafikCahaya].forEach(g=>{
    g.data.labels.length = 0;
    g.data.datasets[0].data.length = 0;
    g.update();
  });
  document.getElementById('valSuhu').innerHTML = '–<span class="unit">°C</span>';
  document.getElementById('valCahaya').innerHTML = '–<span class="unit">ADC</span>';
}

function tambahTitik(waktu, suhu, cahaya){
  const potong = (g)=>{ if(g.data.labels.length > MAX_TITIK){
    g.data.labels.shift(); g.data.datasets[0].data.shift(); } };

  for(let i=0;i<waktu.length;i++){
    const t = Math.round(waktu[i]);
    grafikSuhu.data.labels.push(t);   grafikSuhu.data.datasets[0].data.push(suhu[i]);
    grafikCahaya.data.labels.push(t); grafikCahaya.data.datasets[0].data.push(cahaya[i]);
    potong(grafikSuhu); potong(grafikCahaya);
  }
  grafikSuhu.update(); grafikCahaya.update();
}

function perbaruiTombol(){
  document.getElementById('btnMulai').disabled = merekam;
  document.getElementById('btnBerhenti').disabled = !merekam;
}

async function tarikData(){
  let d;
  try{
    d = await (await fetch(`/api/data?since=${since}`)).json();
  }catch(e){
    document.getElementById('dot').className = 'dot';
    document.getElementById('statusText').textContent = 'Server Python tidak merespons';
    return;
  }

  if(sesi !== null && d.session !== sesi){ since = 0; kosongkanGrafik(); }
  sesi = d.session;

  if(d.start === 0 && since !== 0) kosongkanGrafik();
  if(d.time.length) tambahTitik(d.time, d.temp, d.light);
  since = d.total;

  merekam = d.collecting;
  perbaruiTombol();

  if(d.latest.temp !== null){
    document.getElementById('valSuhu').innerHTML =
      `${d.latest.temp.toFixed(1)}<span class="unit">°C</span>`;
    document.getElementById('valCahaya').innerHTML =
      `${d.latest.light}<span class="unit">ADC</span>`;
  }

  const dot = document.getElementById('dot');
  const teks = document.getElementById('statusText');
  if(!d.connected){
    dot.className = 'dot';
    teks.textContent = 'Broker terputus';
  }else if(d.collecting){
    dot.className = 'dot live';
    teks.textContent = `Merekam · ${d.total} data`;
  }else{
    dot.className = 'dot idle';
    teks.textContent = d.total ? `Berhenti · ${d.total} data tersimpan` : 'Terhubung, belum merekam';
  }

  document.getElementById('btnLedOn').setAttribute('aria-pressed', d.led === '1');
  document.getElementById('btnLedOff').setAttribute('aria-pressed', d.led === '0');
}

async function kirim(url, body){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
                             body:JSON.stringify(body||{})});
  return r.json();
}

document.getElementById('btnMulai').onclick = async ()=>{
  await kirim('/api/collect',{active:true});
  pesan('Merekam data dari sensor.');
  tarikData();
};
document.getElementById('btnBerhenti').onclick = async ()=>{
  await kirim('/api/collect',{active:false});
  pesan('Perekaman dihentikan. Data yang sudah masuk tetap tersimpan.');
  tarikData();
};
document.getElementById('btnReset').onclick = async ()=>{
  await kirim('/api/reset');
  since = 0; kosongkanGrafik();
  pesan('Data dihapus.');
  tarikData();
};
document.getElementById('btnExcel').onclick = ()=>{
  pesan('Menyiapkan file Excel…');
  window.location = '/api/export';
  setTimeout(()=>pesan('File Excel selesai diunduh.'), 1200);
};
document.getElementById('btnLedOn').onclick  = ()=>aturLed('1');
document.getElementById('btnLedOff').onclick = ()=>aturLed('0');

async function aturLed(nilai){
  try{
    const d = await kirim('/api/led',{value:nilai});
    pesan(d.ok ? d.message : d.message, !d.ok);
  }catch(e){
    pesan('Perintah LED gagal dikirim.', true);
  }
  tarikData();
}

tarikData();
setInterval(tarikData, 1000);
</script>
</body>
</html>
